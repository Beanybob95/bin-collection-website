server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Overwrite all three forwarded headers so the client cannot spoof them.
        # Express reads req.ip, req.hostname, and req.secure from these — if nginx
        # didn't overwrite them, a client could inject fake values and bypass rate
        # limiting or forge a secure context.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Host              $host;
    }
}

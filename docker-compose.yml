services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/bincollection?replicaSet=rs0}
    command: sh -lc "npx nodemon app.js"
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: